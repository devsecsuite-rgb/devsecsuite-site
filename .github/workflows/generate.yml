name: Generate Developer Tool

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate tool
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/generate_calculator.py
      - name: Commit and push
        run: |
          git config user.name "DevSecSuite Bot"
          git config user.email "bot@devsecsuite.com"
          if [[ -n $(git status --porcelain) ]]; then
            git add .
            git commit -m "Auto-generate tool $(date -u +%Y-%m-%d)"
            git push
          fi
